services:
  # The Web Server (PHP 8.x + Nginx)
  web:
    image: richarvey/nginx-php-fpm:latest
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
    environment:
      - SKIP_COMPOSER=1
      - WEBROOT=/var/www/html

  # The Database (MySQL 8.0) - System A
  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=eco_waste
    volumes:
      - ./db:/docker-entrypoint-initdb.d