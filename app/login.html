<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMate - Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Theme Variables */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-panel: #002d5e;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-light: #ffffff;
            --border-color: #e1e5e9;
            --accent-color: #00897b;
            --card-bg: #ffffff;
            --shadow: rgba(0,0,0,0.1);
            --gradient-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-color: #4caf50;
            --error-color: #f44336;
            --warning-color: #ff9800;
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --bg-panel: #1e3a5f;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --text-light: #ffffff;
            --border-color: #444;
            --accent-color: #4db6ac;
            --card-bg: #333333;
            --shadow: rgba(0,0,0,0.3);
            --gradient-bg: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--gradient-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
        }

        /* Animated background particles */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .login-container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px var(--shadow);
            width: 100%;
            max-width: 450px;
            text-align: center;
            position: relative;
            z-index: 1;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .login-header {
            margin-bottom: 40px;
            position: relative;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--accent-color), #4db6ac);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            box-shadow: 0 8px 20px rgba(0, 137, 123, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .logo-text h1 {
            color: var(--text-primary);
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(135deg, var(--accent-color), #4db6ac);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text p {
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 500;
        }

        .theme-toggle {
            position: absolute;
            top: -10px;
            right: -10px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(180deg);
            border-color: var(--accent-color);
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-container {
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 16px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: var(--card-bg);
            box-shadow: 0 0 0 4px rgba(77, 182, 172, 0.1);
            transform: translateY(-2px);
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .form-group input:focus + .input-icon {
            color: var(--accent-color);
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-color) 0%, #4db6ac 100%);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0, 137, 123, 0.4);
        }

        .login-btn:active {
            transform: translateY(-1px);
        }

        .login-btn:disabled {
            background: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .login-btn:disabled::before {
            display: none;
        }

        .error-message, .success-message {
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-weight: 500;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .error-message {
            background: rgba(244, 67, 54, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(244, 67, 54, 0.3);
            border-left: 4px solid var(--error-color);
        }

        .success-message {
            background: rgba(76, 175, 80, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-left: 4px solid var(--success-color);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .demo-accounts {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 16px;
            margin-top: 30px;
            text-align: left;
            transition: all 0.3s ease;
        }

        .demo-accounts h3 {
            color: var(--text-primary);
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .account-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .account-item:last-child {
            border-bottom: none;
        }

        .account-item:hover {
            background: var(--card-bg);
            margin: 0 -15px;
            padding: 15px;
            border-radius: 8px;
        }

        .account-info {
            flex: 1;
        }

        .account-role {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 16px;
            margin-bottom: 4px;
        }

        .account-creds {
            font-size: 13px;
            color: var(--text-secondary);
            font-family: 'Courier New', monospace;
            background: var(--card-bg);
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
        }

        .use-btn {
            background: linear-gradient(135deg, var(--accent-color), #4db6ac);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .use-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 137, 123, 0.3);
        }

        .loading {
            display: none;
            margin-top: 15px;
        }

        .spinner {
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobile Responsive */
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 25px;
                margin: 10px;
            }
            
            .logo-text h1 {
                font-size: 28px;
            }
            
            .form-group input {
                padding: 14px 18px 14px 45px;
            }
            
            .demo-accounts {
                padding: 20px;
            }
        }

        /* Loading animation for page transition */
        .page-transition {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--gradient-bg);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .page-transition.active {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation" id="bgAnimation"></div>
    
    <!-- Page Transition -->
    <div class="page-transition" id="pageTransition">
        <div style="text-align: center; color: white;">
            <div class="spinner" style="border-color: rgba(255,255,255,0.3); border-top-color: white; margin-bottom: 20px;"></div>
            <h3>Signing you in...</h3>
        </div>
    </div>

    <div class="login-container">
        <div class="login-header">
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark/light theme">🌓</button>
            <div class="logo-container">
                <div class="logo-icon">🌱</div>
                <div class="logo-text">
                    <h1>EcoMate</h1>
                    <p>Command Center</p>
                </div>
            </div>
        </div>

        <form id="loginForm">
            <div class="error-message" id="errorMessage">
                Invalid username or password
            </div>
            
            <div class="success-message" id="successMessage">
                Login successful! Redirecting...
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-container">
                    <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter your username">
                    <div class="input-icon">👤</div>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-container">
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
                    <div class="input-icon">🔒</div>
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                Sign In
            </button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>
        </form>

        <div class="demo-accounts">
            <h3>🚀 Demo Accounts</h3>
            <div class="account-item">
                <div class="account-info">
                    <div class="account-role">👑 Administrator</div>
                    <div class="account-creds">admin / admin123</div>
                </div>
                <button class="use-btn" onclick="fillCredentials('admin', 'admin123')">Use</button>
            </div>
            <div class="account-item">
                <div class="account-info">
                    <div class="account-role">👤 Standard User</div>
                    <div class="account-creds">user / user123</div>
                </div>
                <button class="use-btn" onclick="fillCredentials('user', 'user123')">Use</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const loading = document.getElementById('loading');
            const errorMessage = document.getElementById('errorMessage');

            // Show loading state
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing In...';
            loading.style.display = 'block';
            errorMessage.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch('login.php', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.status === 'success') {
                    // Successful login - redirect to main app
                    window.location.href = 'index.html';
                } else {
                    // Show error message
                    errorMessage.style.display = 'block';
                    errorMessage.textContent = data.message || 'Invalid username or password';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.style.display = 'block';
                errorMessage.textContent = 'Connection error. Please try again.';
            } finally {
                // Reset button state
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
                loading.style.display = 'none';
            }
        });

        function fillCredentials(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }

        // Check if already logged in - but don't auto-redirect
        async function checkAuthStatus() {
            try {
                const response = await fetch('whoami.php');
                const data = await response.json();
                
                if (data && data.authenticated) {
                    // Show a message that user is already logged in, but don't redirect
                    const loginForm = document.getElementById('loginForm');
                    loginForm.innerHTML = `
                        <div style="text-align: center; padding: 20px; background: #e8f5e8; border-radius: 8px; margin-bottom: 20px;">
                            <h3 style="color: #2e7d32; margin-bottom: 10px;">Already Logged In</h3>
                            <p style="color: #2e7d32; margin-bottom: 15px;">You are signed in as: <strong>${data.user.username}</strong> (${data.user.role})</p>
                            <button onclick="goToMainApp()" style="background: #2e7d32; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-right: 10px;">Go to Main App</button>
                            <button onclick="logoutAndStay()" style="background: #666; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer;">Logout</button>
                        </div>
                    `;
                }
            } catch (error) {
                // Not logged in or error - show normal login form
                console.log('Not authenticated or error checking auth');
            }
        }

        function goToMainApp() {
            window.location.href = 'index.html';
        }

        async function logoutAndStay() {
            try {
                await fetch('logout.php', { method: 'POST' });
                window.location.reload(); // Reload to show login form
            } catch (error) {
                console.error('Logout error:', error);
                window.location.reload();
            }
        }

        // Check auth status when page loads
        checkAuthStatus();
    </script>
</body>
</html>
