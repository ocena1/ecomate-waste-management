version: '3.8'

services:
  # The Web Server (PHP 8.x + Nginx) - Production
  web:
    build: .
    ports:
      - "80:80"
    environment:
      - SKIP_COMPOSER=1
      - WEBROOT=/var/www/html
      - PHP_ERRORS_STDERR=1
      - RUN_SCRIPTS=1
      - REAL_IP_HEADER=1
      # Database connection for production
      - DB_HOST=${DB_HOST:-db}
      - DB_NAME=${DB_NAME:-eco_waste}
      - DB_USER=${DB_USER:-root}
      - DB_PASS=${DB_PASS:-root}
    depends_on:
      - db
    restart: unless-stopped

  # The Database (MySQL 8.0) - Production
  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-eco_waste}
      - MYSQL_USER=${MYSQL_USER:-ecomate}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-ecomate123}
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data: